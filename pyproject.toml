[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanov41"
version = "0.1.0"
description = "A nano-scale trainable port of the DeepSeek-V4.1-Flash architecture, with a parity harness against the official reference implementation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QingGo" }]
keywords = ["deepseek", "nanochat", "transformer", "research", "training", "parity"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.9",
    "numpy>=2.0",
    "sympy>=1.13",
]

[project.optional-dependencies]
cuda = ["triton>=3.3", "tilelang>=0.1.15"]
inference = ["safetensors>=0.5", "tokenizers", "transformers", "tqdm"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["nanov41*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
