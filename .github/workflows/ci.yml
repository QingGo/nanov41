name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install project (CPU core) + pytest
        run: python -m pip install -r requirements.txt pytest

      - name: Generated patched reference is up to date
        run: python tools/make_patched_ref.py --check

      - name: Parity harness (fp32)
        run: python parity.py --dtype float32

      - name: Tests
        run: python -m pytest -q
