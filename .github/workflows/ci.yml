name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU PyTorch (pinned)
        # Pin one torch CPU build for the whole matrix: the floating tag resolved to
        # different torch versions for 3.10 vs 3.12 and made the slow kernel-parity
        # subset flaky between runs (same commit passed/failed). 2.14.1 is the newest
        # CPU wheel available for both 3.10 and 3.12.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1"

      - name: Install project (CPU core) + pytest
        run: python -m pip install -r requirements.txt pytest

      - name: Generated patched reference is up to date
        run: python tools/make_patched_ref.py --check

      - name: Parity harness (fp32)
        run: python parity.py --dtype float32

      - name: Tests (fast subset)
        run: python -m pytest -q -m "not slow"

      # Run the two slow kernel-parity scripts as separate steps: a failure then names the
      # script, and the pytest tail is surfaced as public check-run annotations (job logs
      # need admin rights via the API).
      - name: Slow parity — fast_mhc
        run: |
          set +e
          python -m pytest -q "tests/test_kernel_parity.py::test_kernel_parity[fast_mhc]" 2>&1 | tee /tmp/slow_mhc.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::fast_mhc parity failed (rc=$rc); last 80 lines:"
            tail -n 80 /tmp/slow_mhc.log | sed 's/^/::error::/'
          fi
          exit "$rc"

      - name: Slow parity — moe_stacked_model
        run: |
          set +e
          python -m pytest -q "tests/test_kernel_parity.py::test_kernel_parity[moe_stacked_model]" 2>&1 | tee /tmp/slow_stacked.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::moe_stacked_model parity failed (rc=$rc); last 80 lines:"
            tail -n 80 /tmp/slow_stacked.log | sed 's/^/::error::/'
          fi
          exit "$rc"

      - name: Experiments CPU tests (optional kernels)
        run: python -m pytest experiments/tl_kernels/tests -q
