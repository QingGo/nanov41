name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install project (CPU core) + pytest
        run: python -m pip install -r requirements.txt pytest

      - name: Generated patched reference is up to date
        run: python tools/make_patched_ref.py --check

      - name: Parity harness (fp32)
        run: python parity.py --dtype float32

      - name: Tests (fast subset)
        run: python -m pytest -q -m "not slow"

      - name: Tests (slow kernel-parity subset)
        # On failure, surface the pytest tail as an error annotation: job logs need admin
        # rights via the API, while check-run annotations are public.
        run: |
          set +e
          python -m pytest -q -m slow 2>&1 | tee /tmp/slow.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::slow kernel-parity subset failed (rc=$rc); last 80 lines:"
            tail -n 80 /tmp/slow.log | sed 's/^/::error::/'
          fi
          exit "$rc"

      - name: Experiments CPU tests (optional kernels)
        run: python -m pytest experiments/tl_kernels/tests -q
